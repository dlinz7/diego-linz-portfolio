name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  # Planned additions, in build order: size-limit budget, Playwright + axe across
  # device projects, Lighthouse CI on /, /personnel-file and /apply/identity.
